# Builds the Storybook and publishes it to GitHub Pages.
#
# Every push to main deploys to https://o16s.github.io/rules-editor/.
# Pull requests run the tests and the build without a deploy.
# "Run workflow" (workflow_dispatch) deploys any branch by hand.
#
# One-time setup in the repo settings: Pages → Source → "GitHub Actions".

name: Storybook

on:
  push:
    branches: [main]
    paths-ignore: ["rules-engine/**"]
  pull_request:
    paths-ignore: ["rules-engine/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build-storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    # Deploy on a push to main, or on a manual run from any branch.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
